name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  shells:
    name: Test ${{ matrix.shell }} Shell
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [bash, zsh, fish]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Dockerfiles are multi-stage and build dirvana themselves;
      # no host Go toolchain is needed.
      - name: Build Docker image
        run: docker build -t dirvana-test-${{ matrix.shell }} -f tests/integration/shells/Dockerfile.${{ matrix.shell }} .

      - name: Run ${{ matrix.shell }} integration tests
        run: docker run --rm dirvana-test-${{ matrix.shell }}

  summary:
    name: Integration Tests Summary
    runs-on: ubuntu-latest
    needs: [shells]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.shells.result }}" = "success" ]; then
            echo "✅ All integration tests passed!"
          else
            echo "❌ Some integration tests failed"
            exit 1
          fi
