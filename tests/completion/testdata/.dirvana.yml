aliases:
  k: kubectl
  tf: terraform
  a: aqua
  g:
    command: git
    completion: git
  # A tool the shells ship no completions for: only dirvana can complete it
  ut: unpackaged-tool
  # Aliases named after the command they wrap, the usual shape of a wrapper
  # script. In fish these make the coverage probe complete the very name it
  # is registered on, which used to loop.
  kubectl:
    command: kubectl
    completion: kubectl
  unpackaged-tool:
    command: unpackaged-tool
    completion: unpackaged-tool

functions:
  # Simple function with parameters
  testfunc: |
    echo "Dirvana function works: $1"

env:
  TOTO: test
  CURRENT_DIR:
    sh: pwd
  TEST_OVERRIDED_VAR: from-testdata
