aliases:
  k: kubectl
  tf: terraform
  a: aqua
  g:
    command: git
    completion: git
  # A tool the shells ship no completions for: only dirvana can complete it
  ut: unpackaged-tool

functions:
  # Simple function with parameters
  testfunc: |
    echo "Dirvana function works: $1"

env:
  TOTO: test
  CURRENT_DIR:
    sh: pwd
  TEST_OVERRIDED_VAR: from-testdata
